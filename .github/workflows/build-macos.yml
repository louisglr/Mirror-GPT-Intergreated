name: Build MIRROR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build, test and validate AU/VST3
    runs-on: macos-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure universal Release
        run: >
          cmake -S . -B build -G Xcode
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run deterministic DSP smoke tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage plugin bundles
        shell: bash
        run: |
          mkdir -p dist

          while IFS= read -r -d '' bundle; do
            ditto "$bundle" "dist/$(basename "$bundle")"
          done < <(find build -type d -name '*.component' -print0)

          while IFS= read -r -d '' bundle; do
            ditto "$bundle" "dist/$(basename "$bundle")"
          done < <(find build -type d -name '*.vst3' -print0)

          if [ -z "$(find dist -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "No AU or VST3 bundle was produced."
            exit 1
          fi

      - name: Ad-hoc sign test bundles
        shell: bash
        run: |
          find dist -type d \( -name '*.component' -o -name '*.vst3' \) -print0 |
            while IFS= read -r -d '' bundle; do
              codesign --force --deep --sign - "$bundle"
              codesign --verify --deep --strict --verbose=2 "$bundle"
            done

      - name: Validate Audio Unit
        shell: bash
        run: |
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          while IFS= read -r -d '' bundle; do
            ditto "$bundle" "$HOME/Library/Audio/Plug-Ins/Components/$(basename "$bundle")"
          done < <(find dist -type d -name '*.component' -print0)
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          # MIRROR accepts MIDI while processing audio, so JUCE correctly
          # registers it as an Audio Unit Music Effect (aumf), not aufx.
          auval -v aumf MIRR LGRL

      - name: Write SHA-256 manifest
        shell: bash
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist MIRROR-macOS.zip
          shasum -a 256 MIRROR-macOS.zip > MIRROR-macOS.zip.sha256

      - name: Upload AU, VST3 and checksum
        uses: actions/upload-artifact@v4
        with:
          name: MIRROR-macOS-${{ github.sha }}
          path: |
            dist/
            MIRROR-macOS.zip
            MIRROR-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 30
